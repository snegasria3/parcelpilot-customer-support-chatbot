services:
  - type: web
    name: parcelpilot-customer-support
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: ALLOW_SAFE_LLM_FALLBACK
        value: "true"
