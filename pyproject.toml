[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parcelpilot-customer-support-chatbot"
version = "2.0.0"
description = "Account-isolated, evidence-grounded ParcelPilot customer support chatbot"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.12.0",
  "python-dotenv==1.2.3",
  "tzdata==2026.3",
  "bcrypt==5.0.0",
  "httpx==0.28.1",
  "socksio==1.0.0",
  "chromadb==1.5.9",
  "fastembed==0.7.4",
  "pypdf==6.16.2",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.15.7",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "model: downloads and exercises the real local embedding model",
]

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
